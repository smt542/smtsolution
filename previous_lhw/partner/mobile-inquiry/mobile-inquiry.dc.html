<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--green:#12B886;--red:#F04452}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;max-width:100%;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}
  .screen{background:#fff;overflow:hidden;position:relative;height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
  .mscroll{flex:1;overflow:auto}
  .mnav{height:70px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 0}
  .mnav .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
  .mnav .it svg{width:28px;height:28px;stroke-width:1.8}
  .bcard{border-bottom:1px solid var(--line);padding:16px 2px}
  .bcard:last-child{border-bottom:0}
  .bname{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .baddr{font-size:13.5px;font-weight:500;color:var(--t3);margin-top:5px;line-height:1.5}
  .bhead{display:flex;align-items:center;gap:10px;cursor:pointer}
  .bchev{flex:none;width:20px;height:20px;color:var(--t4)}
  .bhead:hover .bchev{color:var(--t2)}
  .brow{display:flex;align-items:center;gap:8px;margin-top:11px}
  .brow+.brow{margin-top:6px}
  .blb{flex:none;font-size:12px;font-weight:700;color:var(--t3);width:64px}
  .bval{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--t1)}
  .btel{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:700;color:var(--t2);background:#fff}
  .btel svg{width:14px;height:14px;color:var(--blue)}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin:0 20px 4px}
  .tab{flex:1;text-align:center;padding:12px 0 11px;font-size:15px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
</style>
</helmet>
<div class="screen">
<div style="padding:16px 20px 12px"><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">조회</div></div>

<div style="padding:0 20px 12px">
  <div style="position:relative">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;color:var(--t4);position:absolute;left:14px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3-3"></path></svg>
    <input id="bqQ" placeholder="건물명 검색" style="width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px 0 40px;font:inherit;font-size:15px;font-weight:500;color:var(--t1);background:#fff;outline:none">
  </div>
</div>

<div class="tabs" id="bqTabs"><span class="tab on" data-v="bld">건물</span><span class="tab" data-v="ten">입주자</span></div>

<div class="mscroll">
  <div style="padding:0 20px 18px" id="bqList"></div>
  <div id="bqNone" style="display:none;text-align:center;padding:40px 20px;font-size:14px;font-weight:600;color:var(--t3)">검색 결과가 없어요</div>
</div>

<div class="mnav"><a class="it" href="../mobile-home/mobile-home.dc.html" style="color:var(--t4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"></path><path d="M6 10v9h12v-9"></path></svg>홈</a><a class="it" href="../mobile-inquiry/mobile-inquiry.dc.html" style="color:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3-3"></path></svg>조회</a><a class="it" href="../mobile-profile/mobile-profile.dc.html" style="color:var(--t4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M5 20c1.4-3.6 4-5.4 7-5.4s5.6 1.8 7 5.4"></path></svg>프로필</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const list=document.getElementById('bqList'); if(!list||list.__w)return; list.__w=1;
    const B=[
      {n:'그린빌라',own:'이정훈',ow:'010-2251-7788',ow2:'042-822-4410',ad:'대전 유성구 봉명동 123-4',cl:'해피클린',ct:'010-8842-1190'},
      {n:'중앙타워',own:'박성호',ow:'010-7781-2245',ad:'대전 서구 둔산동 55-1',cl:'미소환경',ct:'010-3320-7745'},
      {n:'라온아파트',own:'김수진',ow:'010-4412-9080',ow2:'010-9911-3070',ad:'대전 중구 대흥동 200',cl:'해피클린',ct:'010-8842-1190'},
      {n:'햇살하이츠',own:'최영신',ow:'010-3345-1120',ad:'대전 유성구 봉명동 987-65',cl:'클린업 대전',ct:'010-5567-2280'},
      {n:'새봄하우스',own:'정민아',ow:'010-6620-3311',ow2:'042-533-7788',ad:'대전 중구 괴정동 77-2',cl:'미소환경',ct:'010-3320-7745'}
    ];
    const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const tel=(v)=>'<a class="btel" href="tel:'+v.replace(/-/g,'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1.1 1A16 16 0 0 1 4 5.1 1 1 0 0 1 5 4z"></path></svg>'+v+'</a>';
    const TEN=[
      {n:'박정호',b:'그린빌라 201호',tels:['010-2251-7788']},
      {n:'이수민',b:'중앙타워 505호',tels:['010-7781-2245','042-822-1180']},
      {n:'김하늘',b:'라온아파트 302호',tels:['010-4412-9080','010-3388-1120','042-611-7720']},
      {n:'오세라',b:'햇살하이츠 1104호',tels:['010-3345-1120']},
      {n:'정민수',b:'그린빌라 302호',tels:['010-5521-8890','010-2200-4471','042-533-9080']},
      {n:'최윤아',b:'새봄하우스 102호',tels:['010-6620-3311','010-7742-1050']}
    ];
    let tab='bld', q='';
    const drawTen=()=>{
      const rows=TEN.filter(x=>!q||(x.n+x.b+(x.tels||[]).join('')).toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n,'ko'));
      list.innerHTML=rows.map(x=>'<div class="bcard">'
        +'<div class="bname">'+esc(x.n)+'</div>'
        +'<div class="baddr">'+esc(x.b)+'</div>'
        +(x.tels||[]).map((v,i)=>'<div class="brow"><span class="blb">'+(i?'':'연락처')+'</span><span class="bval"></span>'+tel(v)+'</div>').join('')
        +'</div>').join('');
      document.getElementById('bqNone').style.display=rows.length?'none':'block';
    };
    const drawBld=()=>{
      const rows=B.filter(b=>!q||(b.n+b.ad+b.cl).toLowerCase().includes(q));
      list.innerHTML=rows.map(b=>'<div class="bcard">'
        +'<div class="bhead" data-b="'+esc(b.n)+'"><div style="flex:1;min-width:0"><div class="bname">'+esc(b.n)+'</div>'
        +'<div class="baddr">'+esc(b.ad)+'</div></div>'
        +'<svg class="bchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></div>'
        +'</div>').join('');
      document.getElementById('bqNone').style.display=rows.length?'none':'block';
    };
    const draw=()=>{ if(tab==='bld')drawBld(); else drawTen();
      document.getElementById('bqQ').placeholder=tab==='bld'?'건물명 검색':'입주자명 또는 전화번호 검색'; };
    draw();
    list.addEventListener('click',(e)=>{ const h=e.target.closest('.bhead'); if(!h)return;
      try{ localStorage.setItem('erp_bld_sel',h.dataset.b); }catch(_){}
      location.href='../mobile-building/mobile-building.dc.html'; });
    document.getElementById('bqTabs').addEventListener('click',(e)=>{ const s=e.target.closest('.tab'); if(!s)return;
      [...s.parentElement.children].forEach(x=>x.classList.toggle('on',x===s)); tab=s.dataset.v; draw(); });
    const qi=document.getElementById('bqQ');
    qi.addEventListener('input',()=>{ q=qi.value.trim().toLowerCase(); draw(); });
    qi.addEventListener('focus',()=>{ qi.style.borderColor='var(--blue)'; qi.style.boxShadow='0 0 0 3px var(--blue-t)'; });
    qi.addEventListener('blur',()=>{ qi.style.borderColor='var(--line)'; qi.style.boxShadow='none'; });
  }
}
</script>
</body>
</html>
