<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--surface:#fff;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--red:#F04452;--red-t:#FDECEE}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;max-width:100%;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}
  .screen{background:#fff;overflow:hidden;position:relative;height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
  .sb{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 9px;font-size:15px;font-weight:700}
  .mscroll{flex:1;overflow:auto;display:flex;flex-direction:column}
  input{font-family:inherit}
</style>
</helmet>
<div class="screen">
  <div class="mscroll">
    <div style="padding:34px 24px 0;text-align:center">
      <div style="display:flex;justify-content:center;padding:6px 0 2px">
        <img src="logo.png" alt="관리비서" style="width:168px;height:auto;object-fit:contain">
      </div>
    </div>

    <div style="padding:30px 24px 0;display:flex;flex-direction:column;gap:12px">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px">아이디</div>
        <input id="mlId" placeholder="아이디를 입력해 주세요" autocomplete="username" style="width:100%;height:54px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:16px;font-weight:500;color:var(--t1);background:#fff;outline:none">
      </div>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px">비밀번호</div>
        <div style="position:relative">
          <input id="mlPw" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" style="width:100%;height:54px;border:1px solid var(--line);border-radius:14px;padding:0 52px 0 16px;font-size:16px;font-weight:500;color:var(--t1);background:#fff;outline:none">
          <div id="mlEye" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--t4);cursor:pointer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width:20px;height:20px"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
          </div>
        </div>
      </div>
      <div id="mlErr" style="display:none;font-size:13px;font-weight:600;color:var(--red);background:var(--red-t);border-radius:11px;padding:11px 13px;line-height:1.5"></div>
      <div id="mlAuto" style="display:flex;align-items:center;gap:9px;padding:4px 2px;cursor:pointer;user-select:none">
        <div id="mlAutoBox" style="width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;opacity:0"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </div>
        <div style="font-size:14px;font-weight:600;color:var(--t2)">자동 로그인</div>
      </div>
    </div>

    <div style="flex:1"></div>

    <div style="padding:18px 24px 30px;display:flex;flex-direction:column;gap:14px">
      <div id="mlSubmit" style="height:56px;border-radius:15px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 20px -8px rgba(20,164,151,.55)">로그인</div>
      <div style="text-align:center;font-size:12.5px;font-weight:500;color:var(--t4);line-height:1.7">계정 문의는 관리사무소에 요청해 주세요.<br>문의 : 042-632-8770</div>
    </div>
  </div>
</div>
<div id="mlToast" style="display:none;position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#191F28;color:#fff;font-size:14px;font-weight:700;padding:13px 20px;border-radius:13px;z-index:80;white-space:nowrap"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const $=(id)=>document.getElementById(id);
    if(!$('mlSubmit')||document.body.__mlWired)return;
    document.body.__mlWired=1;
    const KEY='erp_partner_login_auto';
    const toast=(m)=>{ const el=$('mlToast'); el.textContent=m; el.style.display='block';
      clearTimeout(el.__t); el.__t=setTimeout(()=>{ el.style.display='none'; },1800); };
    const ring=(el)=>{ el.addEventListener('focus',()=>{ el.style.borderColor='var(--blue)'; el.style.boxShadow='0 0 0 3px var(--blue-t)'; });
      el.addEventListener('blur',()=>{ el.style.borderColor='var(--line)'; el.style.boxShadow='none'; }); };
    ring($('mlId')); ring($('mlPw'));

    let auto=false;
    try{ const s=localStorage.getItem(KEY); if(s){ auto=true; $('mlId').value=s; } }catch(_){}
    const paintAuto=()=>{ const box=$('mlAutoBox'), ck=box.querySelector('svg');
      box.style.background=auto?'var(--blue)':'#fff';
      box.style.borderColor=auto?'var(--blue)':'var(--line)';
      ck.style.opacity=auto?'1':'0'; };
    paintAuto();
    $('mlAuto').addEventListener('click',()=>{ auto=!auto; paintAuto(); });

    let shown=false;
    $('mlEye').addEventListener('click',()=>{ shown=!shown;
      $('mlPw').type=shown?'text':'password';
      $('mlEye').style.color=shown?'var(--blue)':'var(--t4)'; });

    const err=(m)=>{ const el=$('mlErr'); if(!m){ el.style.display='none'; return; }
      el.textContent=m; el.style.display='block'; };

    const submit=()=>{
      const id=$('mlId').value.trim(), pw=$('mlPw').value.trim();
      if(!id){ err('아이디를 입력해 주세요'); $('mlId').focus(); return; }
      if(!pw){ err('비밀번호를 입력해 주세요'); $('mlPw').focus(); return; }
      err('');
      try{ if(auto)localStorage.setItem(KEY,id); else localStorage.removeItem(KEY); }catch(_){}
      toast('로그인 중이에요');
      setTimeout(()=>{ location.href='../mobile-home/mobile-home.dc.html'; },600);
    };
    $('mlSubmit').addEventListener('click',submit);
    [$('mlId'),$('mlPw')].forEach(el=>el.addEventListener('keydown',(e)=>{ if(e.key==='Enter')submit(); }));
  }
}
</script>
</body>
</html>
