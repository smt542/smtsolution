<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--amber:#FF922B;--amber-t:#FFF3E6}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;max-width:100%;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  .screen{background:#fff;overflow:hidden;position:relative;height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
  .hdr{flex:none;display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 12px 4px}
  .bk{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .bk:hover{background:var(--bg);color:var(--t2)}
  .bk svg{width:22px;height:22px}
  .body{flex:1;min-height:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 44px) 28px 8px}
  .ic{width:58px;height:58px;border-radius:19px;background:var(--amber-t);color:var(--amber);display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.22,.61,.36,1) both}
  .ic svg{width:28px;height:28px}
  .h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.38;margin:18px 0 0;animation:rise .5s .06s cubic-bezier(.22,.61,.36,1) both}
  .lead{font-size:14.5px;font-weight:600;color:var(--t3);line-height:1.62;margin-top:10px;animation:rise .5s .1s cubic-bezier(.22,.61,.36,1) both}
  .why{margin-top:24px;border:1px solid var(--line);border-radius:18px;padding:6px 16px;animation:rise .5s .16s cubic-bezier(.22,.61,.36,1) both}
  .w{display:flex;gap:11px;padding:15px 0;border-bottom:1px solid var(--line2)}
  .w:last-child{border-bottom:0}
  .w .n{width:22px;height:22px;flex:none;border-radius:8px;background:var(--bg);color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;margin-top:1px}
  .w b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .w span{display:block;font-size:12.5px;font-weight:500;color:var(--t3);line-height:1.6;margin-top:4px}
  .call{display:flex;align-items:center;gap:12px;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--bg);animation:rise .5s .22s cubic-bezier(.22,.61,.36,1) both}
  .call .ci{width:38px;height:38px;flex:none;border-radius:13px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center}
  .call .ci svg{width:19px;height:19px}
  .call .ct{flex:1;min-width:0}
  .call .ct b{display:block;font-size:14.5px;font-weight:700}
  .call .ct span{display:block;font-size:12.5px;font-weight:600;color:var(--t3);margin-top:3px}
  .call a{flex:none;height:38px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--t2);display:inline-flex;align-items:center}
  .call a:hover{border-color:var(--t4);color:var(--t2)}
  .foot{flex:none;padding:14px 28px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;height:56px;border:0;border-radius:16px;font:inherit;font-size:16.5px;font-weight:700;letter-spacing:-.02em;cursor:pointer;transition:transform .12s ease}
  .btn:active{transform:scale(.985)}
  .btn.pri{background:var(--blue);color:#fff}
  .btn.pri:hover{background:var(--blue-d)}
  .btn.alt{background:transparent;color:var(--t3);height:44px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .btn.alt:hover{color:var(--t2)}
  .sheet{position:fixed;left:0;right:0;top:0;height:100dvh;max-height:100dvh;background:rgba(23,31,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:90;overflow:hidden}
  .sheet.show{display:flex}
  .sheet-b{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:440px;padding:10px 24px calc(env(safe-area-inset-bottom) + 22px);height:min(640px,calc(100dvh - 40px));max-height:calc(100dvh - 40px);display:flex;flex-direction:column}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;flex:none}
  .shd{display:flex;align-items:flex-start;gap:8px;flex:none}
  .sback{width:32px;height:32px;flex:none;margin:-2px 0 0 -6px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer}
  .sback:hover{background:var(--bg)}
  .sback svg{width:20px;height:20px}
  .st{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .sd{font-size:13.5px;font-weight:500;color:var(--t3);line-height:1.65;margin-top:7px}
  .stepno{flex:none;font-size:12px;font-weight:700;color:var(--t4);background:var(--bg);border-radius:999px;padding:5px 10px;margin-top:2px}
  .srch{display:flex;align-items:center;gap:8px;height:52px;margin-top:16px;padding:0 14px;border-radius:14px;background:var(--bg);flex:none}
  .srch svg{width:18px;height:18px;color:var(--t3);flex:none}
  .srch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--t1);outline:none}
  .srch input::placeholder{color:var(--t4);font-weight:500}
  .sclear{width:26px;height:26px;flex:none;border:0;border-radius:50%;background:#DDE2E7;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .sclear svg{width:13px;height:13px;color:#fff}
  .cnt{font-size:12.5px;font-weight:600;color:var(--t3);padding:14px 4px 0;flex:none}
  .list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:16px -6px 0;padding:0 6px}
  .opt{display:flex;align-items:center;gap:10px;padding:15px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
  .opt:last-child{border-bottom:0}
  .opt b{font-size:15.5px;font-weight:700}
  .opt span{font-size:12.5px;font-weight:600;color:var(--t3)}
  .opt em{font-style:normal;color:var(--blue-d);background:var(--blue-t);border-radius:4px;padding:0 2px}
  .opt .ck{width:20px;height:20px;flex:none;color:var(--blue);opacity:0}
  .empty{text-align:center;padding:34px 10px 16px}
  .empty b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
  .empty span{display:block;font-size:13px;font-weight:600;color:var(--t3);line-height:1.65;margin-top:8px}
  .ebtn{margin-top:18px;height:44px;padding:0 18px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-size:14px;font-weight:700;color:var(--t2);cursor:pointer}
  .picked{display:flex;align-items:center;gap:10px;margin-top:16px;padding:15px 16px;border-radius:15px;background:var(--blue-t2);flex:none}
  .picked b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em;color:var(--blue-d)}
  .picked span{display:block;font-size:12.5px;font-weight:600;color:var(--t3);margin-top:3px}
  .fin{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 15px;font:inherit;font-size:16px;font-weight:600;color:var(--t1);outline:none;margin-top:14px;flex:none}
  .fin:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
  .uhint{font-size:12px;font-weight:500;color:var(--t4);line-height:1.6;margin-top:9px;padding:0 2px}
  .sbtn{width:100%;height:54px;border:0;border-radius:15px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer;flex:none}
  .sbtn:disabled{background:var(--bg);color:var(--t4);cursor:not-allowed}
</style>
</helmet>
<div class="screen">
  <div class="body">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.2-3.2"></path><path d="M11 8v3M11 14v.4"></path></svg></div>
    <h1 class="h1">등록된 세대를<br>찾지 못했어요</h1>
    <p class="lead"><b class="num" style="color:var(--t2)">010-****-7788</b> 번호로 연결된 세대가 없어요.<br>관리사무소에 등록한 번호의 카카오 계정으로<br>다시 로그인해 주세요.</p>
    <div class="why">
      <div class="w"><div class="n">1</div><div><b>관리사무소에 등록된 번호가 다를 수 있어요</b><span>계약서에 적은 번호와 카카오 계정 번호가 다른 경우예요</span></div></div>
      <div class="w"><div class="n">2</div><div><b>입주 등록이 아직 안 됐을 수 있어요</b><span>입주 직후에는 관리사무소 등록까지 하루 정도 걸려요</span></div></div>
      <div class="w"><div class="n">3</div><div><b>세대주 명의가 가족일 수 있어요</b><span>계약자 본인 번호로 가입된 카카오 계정으로 로그인해 주세요</span></div></div>
    </div>
  </div>
  <div class="foot">
    <button type="button" class="btn pri" id="nmRetry">다른 카카오 계정으로 로그인</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const $=(id)=>document.getElementById(id);
    if(!$('nmRetry')||document.body.__nmW)return; document.body.__nmW=1;
    $('nmRetry').addEventListener('click',()=>{ try{ localStorage.removeItem('res_case'); }catch(_){}
      location.href='../resident-login/resident-login.dc.html'; });
  }
}
</script>
</body>
</html>
