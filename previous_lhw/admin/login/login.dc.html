<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--surface:#fff;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--red:#F04452;--red-t:#FDECEE}
  *{box-sizing:border-box}
  body{margin:0;min-width:1180px;background:#E7EAEE;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  input{font-family:inherit}
</style>
</helmet>
<div style="min-height:100vh;display:flex;background:#fff">
  <div style="flex:1 1 58%;min-width:640px;position:relative;background:linear-gradient(160deg,#0E1E33 0%,#16375a 58%,#1F4E7A 100%);display:flex;flex-direction:column;justify-content:space-between;padding:56px 64px;color:#fff;overflow:hidden">
    <div style="position:absolute;right:-140px;top:-120px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.07)"></div>
    <div style="position:absolute;right:60px;bottom:-180px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.06)"></div>
    <div style="display:flex;align-items:center;gap:12px;position:relative">
      <div style="width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="logo-mark.png" alt="" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font-size:19px;font-weight:800;letter-spacing:-.01em">관리비서</div><div style="font-size:10.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-top:2px">HQ CONSOLE</div></div>
    </div>
    <div style="position:relative;max-width:600px">
      <div style="font-size:48px;font-weight:800;line-height:1.28;letter-spacing:-.03em;text-wrap:pretty">모든 관리업체를<br>한 콘솔에서</div>
      <div style="font-size:18px;font-weight:500;line-height:1.7;color:rgba(255,255,255,.86);margin-top:20px">테넌트 계약과 사용량, 이관 현황을 본사에서 관리합니다. 입주자 개인정보는 조회되지 않으며 모든 접근은 기록됩니다.</div>
   </div>
        <div style="position:relative;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.62)">© 2026 관리비서 · 본사 전용 콘솔</div>
  </div>

  <div style="flex:0 0 480px;display:flex;align-items:center;justify-content:center;padding:48px 56px;background:#fff">
  <div style="width:100%;max-width:368px">

    <div style="margin-bottom:26px">
      <div style="font-size:24px;font-weight:800;letter-spacing:-.02em">본사 관리자 로그인</div>
      <div style="font-size:13.5px;font-weight:500;color:var(--t3);margin-top:6px">본사 계정으로 로그인해 주세요.</div>
    </div>

    <div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-direction:column;gap:7px">
          <label for="lgId" style="font-size:12.5px;font-weight:700;color:var(--t3)">아이디</label>
          <input id="lgId" placeholder="아이디를 입력해 주세요" autoComplete="username" style="width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 14px;font-size:14.5px;font-weight:500;color:var(--t1);background:#fff;outline:none"></input>
        </div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <label for="lgPw" style="font-size:12.5px;font-weight:700;color:var(--t3)">비밀번호</label>
          <div style="position:relative;display:flex;align-items:center">
            <input id="lgPw" type="password" placeholder="비밀번호를 입력해 주세요" autoComplete="current-password" style="width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 46px 0 14px;font-size:14.5px;font-weight:500;color:var(--t1);background:#fff;outline:none"></input>
            <button type="button" id="lgEye" aria-label="비밀번호 보기" style="position:absolute;right:8px;width:32px;height:32px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t4);cursor:pointer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
            </button>
          </div>
        </div>
        <div id="lgErr" style="display:none;background:var(--red-t);color:var(--red);border-radius:11px;padding:10px 13px;font-size:12.5px;font-weight:700"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0">
          <label id="lgAuto" style="display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--t2);cursor:pointer;user-select:none">
            <span id="lgAutoBox" style="width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;opacity:0"><path d="M4 12.5l5 5L20 6.5"></path></svg>
            </span>자동 로그인
          </label>
        </div>
        <button type="button" id="lgSubmit" style="margin-top:6px;width:100%;height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;cursor:pointer">로그인</button>
      </div>
    </div>

    <div style="text-align:center;font-size:12px;font-weight:500;color:var(--t4);line-height:1.7;margin-top:20px">
      본사 관리자만 접근할 수 있는 콘솔입니다.<br>모든 로그인과 대리 접속은 감사 로그에 기록됩니다.
    </div>
  </div>
</div>
<div id="lgToast" style="display:none;position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#191F28;color:#fff;font-size:14px;font-weight:700;padding:13px 20px;border-radius:12px;z-index:100"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const $=(id)=>document.getElementById(id);
    if(!$('lgSubmit')||document.body.__lgWired)return;
    document.body.__lgWired=1;
    const KEY='erp_hq_login_auto';
    const toast=(m)=>{ const el=$('lgToast'); el.textContent=m; el.style.display='block';
      clearTimeout(el.__t); el.__t=setTimeout(()=>{ el.style.display='none'; },1800); };
    const focusRing=(el)=>{ el.addEventListener('focus',()=>{ el.style.borderColor='var(--blue)'; el.style.boxShadow='0 0 0 3px var(--blue-t)'; });
      el.addEventListener('blur',()=>{ el.style.borderColor='var(--line)'; el.style.boxShadow='none'; }); };
    focusRing($('lgId')); focusRing($('lgPw'));

    let auto=false;
    try{ const s=localStorage.getItem(KEY); if(s){ auto=true; $('lgId').value=s; } }catch(_){}
    const paintAuto=()=>{ const box=$('lgAutoBox'), ck=box.querySelector('svg');
      box.style.background=auto?'var(--blue)':'#fff';
      box.style.borderColor=auto?'var(--blue)':'var(--line)';
      ck.style.opacity=auto?'1':'0'; };
    paintAuto();
    $('lgAuto').addEventListener('click',(e)=>{ e.preventDefault(); auto=!auto; paintAuto(); });

    let shown=false;
    $('lgEye').addEventListener('click',()=>{ shown=!shown;
      $('lgPw').type=shown?'text':'password';
      $('lgEye').style.color=shown?'var(--blue)':'var(--t4)'; });

    const err=(m)=>{ const el=$('lgErr'); if(!m){ el.style.display='none'; return; }
      el.textContent=m; el.style.display='block'; };

    const submit=()=>{
      const id=$('lgId').value.trim(), pw=$('lgPw').value.trim();
      if(!id){ err('아이디를 입력해 주세요'); $('lgId').focus(); return; }
      if(!pw){ err('비밀번호를 입력해 주세요'); $('lgPw').focus(); return; }
      err('');
      try{ if(auto)localStorage.setItem(KEY,id); else localStorage.removeItem(KEY); }catch(_){}
      const b=$('lgSubmit'); b.textContent='로그인 중…'; b.style.opacity='.7'; b.disabled=true;
      toast('로그인되었습니다');
      setTimeout(()=>{ location.href='../overview/overview.dc.html'; },700);
    };
    $('lgSubmit').addEventListener('click',submit);
    ['lgId','lgPw'].forEach(id=>$(id).addEventListener('keydown',(e)=>{ if(e.key==='Enter')submit(); }));
  }
}
</script>
</body>
</html>
