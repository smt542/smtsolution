version: 1
frontend:
  phases:
    preBuild:
      commands:
        # 보안 패치(22.23.4+) 보장을 위해 22.x 최신 버전을 매 빌드마다 설치
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - env | grep -e CRON_SECRET -e SUPABASE_SERVICE_ROLE_KEY -e KAKAO_ -e POPBILL_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
