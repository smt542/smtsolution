<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--red:#F04452;--kakao:#FEE500;--kakao-t:#191600}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;max-width:100%;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes riseCard{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes riseCardB{from{opacity:0;transform:translateY(22px) rotate(-4deg) scale(.97)}to{opacity:.55;transform:rotate(-4deg) translateY(-6px) scale(.96)}}
  @keyframes floatBig{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-16px) rotate(-1.4deg)}50%{transform:translateY(-4px) rotate(.6deg)}75%{transform:translateY(-19px) rotate(1.2deg)}100%{transform:translateY(0) rotate(0deg)}}
  @keyframes floatBigB{0%{transform:rotate(-4deg) translateY(-6px)}30%{transform:rotate(-6.5deg) translateY(-20px)}60%{transform:rotate(-2.5deg) translateY(-8px)}100%{transform:rotate(-4deg) translateY(-6px)}}
  .screen{background:#fff;overflow:hidden;position:relative;height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
  .glow{position:absolute;inset:-20% -30% auto -30%;height:62%;background:radial-gradient(60% 60% at 50% 40%,rgba(20,164,151,.13),rgba(20,164,151,0) 70%);pointer-events:none}
  .top{flex:none;padding:calc(env(safe-area-inset-top) + 34px) 28px 0;position:relative}
  .brand{display:flex;align-items:center;gap:8px;animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
  .brand img{width:26px;height:26px;object-fit:contain;display:block}
  .brand b{font-size:15.5px;font-weight:800;letter-spacing:-.02em;color:#16375a}
  .brand b em{font-style:normal;color:var(--blue)}
  .h1{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:26px 0 0;animation:rise .55s .06s cubic-bezier(.22,.61,.36,1) both}
  .h1 span{color:var(--blue)}
  .lead{font-size:15px;font-weight:600;color:var(--t3);line-height:1.62;margin-top:11px;animation:rise .55s .12s cubic-bezier(.22,.61,.36,1) both}
  .stagearea{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 28px 0}
  .cards{position:relative;width:100%;max-width:300px}
  .cardB{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:20px;transform-origin:50% 100%;opacity:.55;animation:riseCardB .6s .18s cubic-bezier(.22,.61,.36,1) both,floatBigB 7s 1.35s ease-in-out infinite}
  .card{position:relative;background:#fff;border-radius:20px;padding:20px;box-shadow:0 18px 40px -18px rgba(23,31,40,.35),0 2px 6px rgba(23,31,40,.06);animation:riseCard .6s .24s cubic-bezier(.22,.61,.36,1) both,floatBig 7s 1s ease-in-out infinite}
  .cw{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cw span{font-size:12.5px;font-weight:600;color:var(--t3)}
  .chip{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:7px;color:var(--red);background:#FDECEE}
  .chip.ok{color:var(--blue-d);background:var(--blue-t)}
  .amt{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:9px;font-variant-numeric:tabular-nums}
  .amt i{font-style:normal;font-size:17px;font-weight:700;margin-left:2px}
  .meta{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--t3)}
  .meta b{color:var(--t2);font-weight:700}
  .split{height:1px;background:var(--line2);margin:15px 0 13px}
  .mini{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--t2)}
  .mini+.mini{margin-top:8px}
  .mini b{font-weight:700;font-variant-numeric:tabular-nums}
  .foot{flex:none;margin-top:auto;padding:20px 28px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;align-items:stretch;gap:14px;animation:rise .55s .3s cubic-bezier(.22,.61,.36,1) both}
  .kakao{width:100%;height:56px;border:0;border-radius:16px;background:var(--kakao);color:var(--kakao-t);font:inherit;font-size:16.5px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
  .kakao:hover{filter:brightness(.97)}
  .kakao:active{transform:scale(.985)}
  .kakao svg{width:21px;height:21px}
  .alt{align-self:center;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--t3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px}
  .alt:hover{color:var(--t2)}
  .note{font-size:11.5px;font-weight:500;color:var(--t4);text-align:center;line-height:1.7}
  .note a{color:var(--t3)}
  .sheet{position:fixed;left:0;right:0;top:0;height:100dvh;max-height:100dvh;background:rgba(23,31,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:90;overflow:hidden}
  .sheet.show{display:flex}
  .sheet-b{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:440px;padding:10px 24px calc(env(safe-area-inset-bottom) + 24px)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .sheet-t{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .sheet-d{font-size:14px;font-weight:500;color:var(--t2);line-height:1.65;margin-top:8px}
  .sheet-btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:15.5px;font-weight:700;margin-top:20px;cursor:pointer}
  .sheet-btn:hover{background:var(--blue-d)}
  .sheet-alt{width:100%;height:40px;margin-top:8px;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--t4);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .sheet-alt:hover{color:var(--t3)}
  .stagearea{overflow:hidden}
  @media (max-height:760px){
    .top{padding-top:calc(env(safe-area-inset-top) + 24px)}
    .h1{font-size:24px;margin-top:20px}
    .lead{font-size:14px;margin-top:9px}
    .amt{font-size:27px}
  }
  @media (max-height:660px){
    .lead{display:none}
    .card{padding:17px}
    .cards{max-width:284px}
    .amt{font-size:25px}
    .split{margin:12px 0 10px}
    .mini{font-size:12.5px}
    .mini+.mini{margin-top:6px}
    .foot{padding-top:14px;gap:11px}
  }
  @media (max-height:560px){
    .h1{font-size:20px;margin-top:12px}
    .top{padding-top:calc(env(safe-area-inset-top) + 16px)}
    .cards{max-width:266px}
    .card{padding:15px}
    .amt{font-size:23px;margin-top:6px}
    .meta{margin-top:5px;font-size:11.5px}
    .split{margin:10px 0 8px}
    .foot{padding-top:10px;gap:9px}
    .kakao{height:50px;font-size:15.5px}
  }
</style>
</helmet>
<div class="screen">
  <div class="glow"></div>
  <div class="top">
    <div class="brand"><img src="logo-mark.png" alt="" width="26" height="26"><b>관리<em>비서</em></b></div>
    <h1 class="h1">이번 달 관리비,<br><span>앱에서 바로 확인</span>하세요</h1>
    <p class="lead">고지서 없이도 항목별 금액과 납부일까지<br>한눈에. 납부 계좌도 바로 복사해요.</p>
  </div>
  <div class="stagearea">
    <div class="cards">
      <div class="cardB"></div>
      <div class="card"><div class="cardIn">
        <div class="cw"><span>2026년 8월 관리비</span><span class="chip ok">납부 완료</span></div>
        <div class="amt num">128,400<i>원</i></div>
        <div class="meta">8월 21일 납부 · 그린빌라 201호</div>
        <div class="split"></div>
        <div class="mini"><span>일반관리비</span><b class="num">62,000원</b></div>
        <div class="mini"><span>전기</span><b class="num">38,700원</b></div>
        <div class="mini"><span>수도 · 가스</span><b class="num">27,700원</b></div>
      </div></div>
    </div>
  </div>
  <div class="foot">
    <button type="button" class="kakao" id="rlKakao">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.6c-4.86 0-8.8 3.02-8.8 6.75 0 2.4 1.62 4.51 4.06 5.72l-.98 3.6c-.9.33.25.6.53.43l4.32-2.84c.28.02.57.04.87.04 4.86 0 8.8-3.02 8.8-6.95S16.86 3.6 12 3.6z"></path></svg>
      카카오톡으로 3초 만에 시작
    </button>
    <div class="note"><a href="../resident-terms/resident-terms.dc.html">이용약관</a> · <a href="../resident-privacy/resident-privacy.dc.html">개인정보 처리방침</a>에 동의하고 시작합니다</div>
  </div>
</div>

<div class="sheet" id="rlSheet"><div class="sheet-b">
  <div class="grab"></div>
  <div class="sheet-t" id="rlST">카카오 로그인으로 연결할까요?</div>
  <div class="sheet-d" id="rlSD">카카오톡에 등록된 휴대폰 번호로 세대 정보를 자동으로 찾아드려요.</div>
  <button type="button" class="sheet-btn" id="rlSOk">계속하기</button>
  <button type="button" class="sheet-alt" id="rlSFail">테스트: 세대 정보 없음으로 진행</button>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const $=(id)=>document.getElementById(id);
    if(!$('rlKakao')||document.body.__rlW)return; document.body.__rlW=1;
    const sheet=$('rlSheet');
    const open=(t,d,ok)=>{ $('rlST').textContent=t; $('rlSD').textContent=d; $('rlSOk').textContent=ok;
      sheet.classList.add('show'); };
    $('rlKakao').addEventListener('click',()=>open('카카오 로그인으로 연결할까요?','카카오톡에 등록된 휴대폰 번호로 세대 정보를 자동으로 찾아드려요.','계속하기'));
    sheet.addEventListener('click',(e)=>{
      if(e.target.id==='rlSOk'){ sheet.classList.remove('show');
        try{ localStorage.setItem('res_case','ok'); }catch(_){}
        location.href='../resident-auth/resident-auth.dc.html'; return; }
      if(e.target.id==='rlSFail'){ sheet.classList.remove('show');
        try{ localStorage.setItem('res_case','fail'); }catch(_){}
        location.href='../resident-auth/resident-auth.dc.html'; return; }
      if(e.target===sheet)sheet.classList.remove('show'); });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape')sheet.classList.remove('show'); });
  }
}
</script>
</body>
</html>
