<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--kakao:#FEE500}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;max-width:100%;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .screen{background:#fff;overflow:hidden;position:relative;height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 32px}
  .ring{position:relative;width:74px;height:74px;animation:pop .4s cubic-bezier(.22,.61,.36,1) both}
  .ring i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--blue-t);border-top-color:var(--blue);animation:spin 1s linear infinite}
  .ring img{position:absolute;inset:0;margin:auto;width:34px;height:34px;object-fit:contain}
  .msg{text-align:center;animation:rise .5s .1s cubic-bezier(.22,.61,.36,1) both}
  .msg b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
  .msg span{display:block;font-size:14px;font-weight:600;color:var(--t3);margin-top:8px;line-height:1.6}
  .steps{display:flex;gap:6px;margin-top:4px;animation:rise .5s .16s cubic-bezier(.22,.61,.36,1) both}
  .steps i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .steps i.on{background:var(--blue)}
</style>
</helmet>
<div class="screen">
  <div class="ring"><i></i><img src="logo-mark.png" alt="" width="34" height="34"></div>
  <div class="msg"><b id="raT">카카오 계정으로 확인 중</b><span id="raD">잠시만 기다려 주세요</span></div>
  <div class="steps"><i class="on" id="rs1"></i><i id="rs2"></i><i id="rs3"></i></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ setTimeout(()=>this.boot(),40); }
  boot(){
    const $=(id)=>document.getElementById(id);
    if(!$('raT')||document.body.__raW)return; document.body.__raW=1;
    const steps=[
      {t:'카카오 계정으로 확인 중',d:'잠시만 기다려 주세요',on:1},
      {t:'세대 정보를 찾고 있어요',d:'연락처로 등록된 세대를 조회해요',on:2},
      {t:'거의 다 됐어요',d:'확인 화면으로 이동합니다',on:3}
    ];
    let i=0;
    const paint=()=>{ const s=steps[i]; $('raT').textContent=s.t; $('raD').textContent=s.d;
      [1,2,3].forEach(n=>$('rs'+n).classList.toggle('on',n<=s.on)); };
    const tick=()=>{ i++; if(i<steps.length){ paint(); setTimeout(tick,900); }
      else setTimeout(()=>{
        let c='ok'; try{ c=localStorage.getItem('res_case')||'ok'; }catch(_){}
        location.href=(c==='fail')?'../resident-nomatch/resident-nomatch.dc.html':'../resident-verify/resident-verify.dc.html'; },500); };
    setTimeout(tick,900);
  }
}
</script>
</body>
</html>
