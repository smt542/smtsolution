<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--surface:#fff;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--green:#12B886;--green-t:#E6F8F1;--red:#F04452;--red-t:#FDECEE;--amber:#FF922B;--amber-t:#FFF3E6}

  body{margin:0;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}

  .lc-sub{font-size:16px;color:var(--t3);font-weight:600;margin:8px 0 40px}
  .lc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .lc-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(23,31,40,.05);text-align:left;display:block}

  .lc-go{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--blue)}
  .appbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;z-index:50}

  .appbar .ttl{font-size:14px;font-weight:700;color:var(--t3)}

  .phone{width:380px;background:#0E1420;border-radius:54px;padding:11px;box-shadow:0 30px 70px -20px rgba(23,31,40,.45)}
  .screen{background:var(--bg);border-radius:44px;overflow:hidden;position:relative;height:800px;display:flex;flex-direction:column}
  .sb{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 9px;font-size:15px;font-weight:700}
  .mscroll{flex:1;overflow:auto;display:flex;flex-direction:column}
  .mnav{height:70px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 0}

  .b-blue{background:var(--blue-t);color:var(--blue-d)}.b-green{background:var(--green-t);color:var(--green)}.b-red{background:var(--red-t);color:var(--red)}.b-gray{background:var(--bg);color:var(--t3)}.b-amber{background:var(--amber-t);color:var(--amber)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:700;border-radius:13px;border:1px solid transparent}
  .btn-pri{background:var(--blue);color:#fff;box-shadow:0 8px 16px -6px rgba(20,164,151,.5)}
  .btn-sec{background:#fff;color:var(--t2);border-color:var(--line)}
  .fl{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:7px}
  .in{height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:15px;font-weight:600}

  .ph-back{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}

  .ph-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .tile{background:#fff;border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.12s}

  .tile-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .tile-ic svg{width:24px;height:24px;stroke-width:1.9}
  .noteBox{display:flex;gap:9px;padding:13px;background:var(--blue-t2);border-radius:12px;font-size:13px;color:var(--t2);font-weight:600;line-height:1.5}

  .hf-app{width:100vw;height:100vh;background:#fff;overflow:hidden;display:flex}

  .lnb-btn svg{width:20px;height:20px;stroke-width:2}

  .hf-side>*{white-space:nowrap}
  .hf-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
  .hf-logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
  .hf-logo img{width:100%;height:100%;object-fit:contain}
  .hf-wm{font-size:19px;font-weight:800;letter-spacing:-.02em;color:#16375a}
  .hf-wm span{color:#17a493}
  .hf-navlbl{font-size:11px;font-weight:700;color:var(--t4);letter-spacing:.04em;padding:12px 12px 6px}
  .hf-nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .hf-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:14px;cursor:pointer;transition:.1s;color:var(--t2);font-weight:600}
  .hf-item:hover{background:var(--bg);color:var(--t2)}
  .hf-item.on{background:var(--blue);color:#fff;font-weight:700}

  .hf-main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
  .hf-top{height:62px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
  .hf-crumb{font-size:12px;color:var(--t3);font-weight:600}
  .hf-h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .hf-icn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--t2)}

  .hf-select{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}

  .hf-seg .si.on{background:#fff;color:var(--t1);box-shadow:0 2px 6px rgba(23,31,40,.1)}
  .hf-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .hf-btn svg{width:16px;height:16px;stroke-width:2}

        <div class="us-m"><span>문자</span><b id="mSms">0건</b></div>
        <div class="us-m"><span>팩스</span><b id="mFax">0건</b></div>
      </div>
    </div>

    <div class="us-alert stop" id="usStop" style="display:none"></div>

    <div class="hf-panel" id="bmPanel" style="min-width:0;overflow:hidden;flex:1;min-height:280px;display:flex;flex-direction:column">
      <div class="hf-panel-h">
        <div class="hf-seg" id="bmFilt" style="padding:3px">
          <div class="si on" data-f="" style="padding:5px 13px;font-size:12.5px">전체</div><div class="si" data-f="wait" style="padding:5px 13px;font-size:12.5px">미입금</div><div class="si" data-f="paid" style="padding:5px 13px;font-size:12.5px">입금</div><div class="si" data-f="none" style="padding:5px 13px;font-size:12.5px">청구 없음</div>
        </div>
        <div style="flex:1"></div>
        <div class="hf-btn pri" id="bmAll" style="height:32px;padding:0 14px;font-size:12.5px">전체 발행</div>
      </div>
      <div style="overflow:auto;max-width:100%;flex:1;min-height:0"><table class="hf-tbl" id="bmTbl" style="min-width:900px">
        <thead><tr><th style="width:15%">업체명</th><th style="width:18%">이메일</th><th class="rt">알림톡</th><th class="rt">문자</th><th class="rt">팩스</th><th class="rt">청구액</th><th class="rt">전월비</th><th>상태</th><th class="rt">처리</th></tr></thead>
        <tbody id="bmRows"></tbody>
      </table></div>
      <div class="hq-pg" id="bmPg"></div>
    </div>

  </div>
</div>

</div>
</div>
<div class="hq-toast" id="hqToast"></div>
<div class="iv-scrim" id="ivScrim">
  <div class="iv-modal">
    <div class="iv-body" id="ivBody"></div>
    <div class="iv-ft">
      <div class="hf-btn sec" id="ivClose">닫기</div>
      <div style="flex:1"></div>
      <div class="hf-btn pri" id="ivPdf">청구서 다운로드</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const key='__hq_'+"usage";
    if(document.body[key])return; document.body[key]=1;
    const toast=(m)=>{ const el=document.getElementById('hqToast'); if(!el)return; el.textContent=m; el.classList.add('show');
      clearTimeout(el.__t); el.__t=setTimeout(()=>el.classList.remove('show'),1700); };
    const $=(id)=>document.getElementById(id);
    const won=(n)=>n.toLocaleString('ko-KR');
    const TN=[['스마일종합관리',48210,2700,700],['대성하우징',51800,4200,1000],['한결주택관리',12400,900,300],['세종주택관리',7800,600,200],['청솔부동산관리',6100,450,100],['우리홈서비스',960,150,0],['새봄주택관리',10500,750,200],['하나로주택관리',15800,1200,300],['성원하우스',9000,600,100],['다솜주택관리',7000,450,100],['영진종합관리',14000,1050,300],['미래에스테이트',0,0,0]];
    const ST=['paid','paid','sent','sent','wait','wait','paid','sent','wait','paid','sent','wait'];
    const PREVBASE=[0.98,1.38,1.02,0.97,1.05,0.61,0.99,0.93,1.01,0.96,1.04,1];
    const prevOf=(i)=>{ if(bmY===2026&&bmM===8)return PREVBASE[i];
      const sd=((bmY*100+bmM)*(i+7))%37; return Math.round((0.86+sd/100)*100)/100; };
    const TREND=[31400,34900,38600,41200,45700,48210];
    const PRICE={alim:12,sms:20,fax:50};
    try{ const c=JSON.parse(localStorage.getItem('hq_cfg')||'null');
      if(c&&c.price)Object.assign(PRICE,c.price); }catch(_){}
    const PB={charged:2800000, threshold:200000};
    let bmY=2026, bmM=8, pickY=2026;
    const bmState={};
    let bmFilt='';
    const bmKey=()=>bmY+'-'+bmM;
    const copyTxt=(t)=>{
      try{ const ta=document.createElement('textarea'); ta.value=t;
        ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
        const ok=document.execCommand('copy'); ta.remove();
        if(ok)return true; }catch(_){}
      if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});
      return false; };
    const stOf=(i)=>{ const k=bmKey()+':'+i; const v=bmState[k]!==undefined?bmState[k]:((bmY===2026&&bmM===8)?ST[i]:'paid'); return v==='sent'?'wait':v; };
    const factor=()=>(bmY===2026&&bmM===8)?1:0.84+((((bmY*100+bmM)%97)%21)/100);
    const calc=()=>{ const k=factor();
      return TN.map((r,i)=>{ const a=Math.round(r[1]*k), b=Math.round(r[2]*k), c=Math.round(r[3]*k);
        return {i,nm:r[0],em:EMAIL[r[0]]||'',a,b,c,amt:a*PRICE.alim+b*PRICE.sms+c*PRICE.fax,st:stOf(i),dlt:prevOf(i)}; }); };
    const LB={wait:['미입금','b-amber'],paid:['입금완료','b-blue']};
    const ORD={wait:0,paid:1};
    const EMAIL={'스마일종합관리':'account@smile-hm.co.kr','대성하우징':'admin@daesung-h.kr','한결주택관리':'billing@hangyeol.co.kr','세종주택관리':'sejong.adm@naver.com','청솔부동산관리':'cheongsol@daum.net','우리홈서비스':'woori.home@gmail.com','새봄주택관리':'saebom@saebom-hm.kr','미래에스테이트':'mirae@mirae-est.co.kr','하나로주택관리':'hanaro.adm@naver.com','성원하우스':'sw-house@daum.net','다솜주택관리':'dasom@dasom-hm.kr','영진종합관리':'yj-total@naver.com'};

    let bmPage=1, bmPer=8;
    const fitBm=()=>{
      const wrap=$('bmTbl')&&$('bmTbl').parentNode, head=$('bmTbl')&&$('bmTbl').querySelector('thead'), row=$('bmRows')&&$('bmRows').querySelector('tr');
      if(!wrap||!head||!row)return;
      const h=wrap.clientHeight-head.getBoundingClientRect().height;
      const rh=row.getBoundingClientRect().height||44;
      const n=Math.max(3,Math.floor(h/rh));
      if(n!==bmPer){ bmPer=n; draw(); }
    };
    const draw=()=>{
      const rows=calc();
      const tot=rows.reduce((s,r)=>s+r.amt,0);
      const due=rows.filter(r=>r.st!=='paid').reduce((s,r)=>s+r.amt,0);
      const billable=rows.filter(r=>r.amt>0);
      const todo=rows.filter(r=>r.st!=='paid'&&r.amt>0).sort((x,y)=>y.amt-x.amt);
      const alim=rows.reduce((s,r)=>s+r.a,0), sms=rows.reduce((s,r)=>s+r.b,0), fax=rows.reduce((s,r)=>s+r.c,0);

      if(due>0){
        $('usLead').innerHTML=bmM+'월 청구할 발송비는 <b>'+won(tot)+'원</b>,<br>이 중 <b class="r">'+won(due)+'원</b>이 아직 안 들어왔어요';
        $('usLeadSub').textContent='미입금 '+todo.length+'곳 · 입금 완료 '+billable.filter(r=>r.st==='paid').length+'곳';
      } else {
        $('usLead').innerHTML=bmM+'월 발송비 <b>'+won(tot)+'원</b>,<br>'+billable.length+'곳 모두 입금됐어요';
        $('usLeadSub').textContent='처리할 건이 없어요';
      }
      $('mAlim').textContent=won(alim)+'건'; $('mSms').textContent=won(sms)+'건'; $('mFax').textContent=won(fax)+'건';


      const sorted=rows.filter(r=>!bmFilt||(bmFilt==='none'?r.amt===0:r.amt>0&&(bmFilt==='paid'?r.st==='paid':r.st!=='paid'))).sort((x,y)=>y.amt-x.amt);
      const pages=Math.max(1,Math.ceil(sorted.length/bmPer));
      if(bmPage>pages)bmPage=pages;
      $('bmRows').innerHTML=sorted.slice((bmPage-1)*bmPer,bmPage*bmPer).map(r=>{
        const d=Math.round((r.dlt-1)*100);
        return '<tr><td style="font-weight:700">'+r.nm+'</td><td class="muted" style="font-size:12.5px;font-weight:600;color:var(--t3)">'+(r.em||'—')+'</td><td class="rt num">'+won(r.a)+'</td><td class="rt num">'+won(r.b)+'</td><td class="rt num">'+won(r.c)+'</td>'
        +'<td class="rt num" style="font-weight:800">'+won(r.amt)+'</td>'
        +'<td class="rt"><span class="dlt '+(d>0?'up':'dn')+'">'+(d>0?'+':'')+d+'%</span></td>'
        +'<td>'+(r.amt===0&&r.st!=='paid'?'<span class="badge b-gray">청구 없음</span>':'<span class="badge '+LB[r.st][1]+'">'+LB[r.st][0]+'</span>')+'</td>'
        +'<td class="rt">'+('<span class="bm-acts"><span class="bm-a" data-act="inv" data-i="'+r.i+'">발행</span>'
            +(r.st==='paid'?'<span class="bm-a" data-act="wait" data-i="'+r.i+'">입금 취소</span>':'<span class="bm-a pri" data-act="paid" data-i="'+r.i+'">입금 확인</span>')
            +'</span>')+'</td></tr>';
      }).join('');
      { let h='<a class="'+(bmPage===1?'off':'')+'" data-bp="'+(bmPage-1)+'">‹</a>';
        for(let i=1;i<=pages;i++)h+='<a class="'+(i===bmPage?'on':'')+'" data-bp="'+i+'">'+i+'</a>';
        h+='<a class="'+(bmPage===pages?'off':'')+'" data-bp="'+(bmPage+1)+'">›</a><span class="info">전체 '+sorted.length+'곳</span>';
        $('bmPg').innerHTML=h; }

      const CURUSE=183570*PRICE.alim+13050*PRICE.sms+3300*PRICE.fax;
      const left=Math.max(0,PB.charged-CURUSE);
      const cls=left<=0?'stop':(left<=PB.threshold?'warn':'');
      try{ localStorage.setItem('hq_pb',JSON.stringify({left:left,at:Date.now()})); }catch(_){}
      const st=$('usStop');
      if(left<=0){ st.style.display='flex';
        st.innerHTML='<span>팝빌 포인트가 모두 소진되어 <b>알림톡·문자·팩스 발송이 모두 중단</b>됐어요. 포인트 관리에서 충전해 주세요.</span>'; }
      else st.style.display='none';

    };

    const BILL={bank:'농협은행',acc:'301-0000-0000-01',holder:'주식회사 관리비서',biz:'305-81-00000',
      memo:'입금 시 업체명으로 입금해 주세요. 세금계산서는 입금 확인 후 발행됩니다.',due:'발행일로부터 14일',vat:'별도 (10%)',mgr:'최본사'};
    try{ const c=JSON.parse(localStorage.getItem('hq_cfg')||'null'); if(c&&c.bill)Object.assign(BILL,c.bill); }catch(_){}
    const saveInv=(html,nm)=>{
      const lib=window.htmlToImage;
      if(!lib){ toast('이미지 변환을 불러오지 못했어요'); return Promise.resolve(); }
      const box=document.createElement('div');
      box.style.cssText='position:fixed;left:-10000px;top:0;width:720px;background:#fff;z-index:-1';
      const node=document.createElement('div');
      node.className='iv-body';
      node.style.cssText='width:720px;max-height:none;overflow:visible;padding:32px 34px;background:#fff';
      node.innerHTML=html;
      box.appendChild(node); document.body.appendChild(box);
      return (lib.getFontEmbedCSS?lib.getFontEmbedCSS(node).catch(()=>''):Promise.resolve(''))
        .then((fontCSS)=>lib.toPng(node,{backgroundColor:'#ffffff',pixelRatio:2,fontEmbedCSS:fontCSS||undefined}))
        .then((url)=>{ box.remove(); const a=document.createElement('a'); a.href=url; a.download=nm+'.png'; a.click(); })
        .catch(()=>{ box.remove(); toast('저장에 실패했어요'); });
    };
    const invHtml=(r)=>{
      const i=r.i, today=new Date(), pad=(n)=>String(n).padStart(2,'0');
      const iss=today.getFullYear()+'.'+pad(today.getMonth()+1)+'.'+pad(today.getDate());
      const no='INV-'+bmY+pad(bmM)+'-'+pad(i+1);
      const vat=Math.round(r.amt*0.1), sum=r.amt+vat;
      const line=(nm,q,pr)=>q?'<tr><td class="nm">'+nm+'</td><td class="rt">'+won(q)+'건</td><td class="rt">'+pr+'원</td><td class="rt">'+won(q*pr)+'원</td></tr>':'';
      return '<div class="iv-hd"><div><div class="t">발송비 청구서</div><div class="d">'+no+' · 발행일 '+iss+'</div></div>'
        +'<div class="co"><b>'+BILL.holder+'</b>사업자등록번호 '+BILL.biz+'<br>담당 '+BILL.mgr+'</div></div>'
        +'<div class="iv-to"><div class="nm">'+r.nm+'</div><div class="sub">'+bmY+'년 '+bmM+'월 발송분</div></div>'
        +'<table class="iv-tbl"><thead><tr><th>항목</th><th class="rt">발송 건수</th><th class="rt">단가</th><th class="rt">금액</th></tr></thead><tbody>'
        +line('알림톡',r.a,PRICE.alim)+line('문자',r.b,PRICE.sms)+line('팩스',r.c,PRICE.fax)
        +'</tbody></table>'
        +'<div class="iv-sum">'
        +'<div class="iv-sr">공급가액<span class="v">'+won(r.amt)+'원</span></div>'
        +'<div class="iv-sr">부가세 (10%)<span class="v">'+won(vat)+'원</span></div>'
        +'<div class="iv-sr tot">청구 합계<span class="v">'+won(sum)+'원</span></div></div>'
        +'<div class="iv-acc"><div class="lb">입금 계좌 · 기한 '+BILL.due+'</div>'
        +'<div class="ac">'+BILL.bank+' '+BILL.acc+'</div><div class="ho">예금주 '+BILL.holder+'</div></div>'
        +'<div class="iv-memo">'+BILL.memo+'</div>';
    };
    const openInv=(i)=>{
      const r=calc().find(x=>x.i===i); if(!r)return;
      window.__ivI=i; window.__ivNm=r.nm;
      $('ivBody').innerHTML=invHtml(r);
      $('ivScrim').classList.add('show');
    };
    const bmMenu=()=>{
      $('bmYmpY').textContent=pickY+'년';
      document.querySelectorAll('#bmYmp .hq-ymp-nav').forEach(n=>{ const t=pickY+(+n.dataset.yn); n.classList.toggle('off',t<2025||t>2026); });
      let h=''; for(let m=1;m<=12;m++){ const dis=(pickY===2026&&m>8);
        h+='<div class="hq-ymp-m'+(dis?' off':'')+((pickY===bmY&&m===bmM)?' on':'')+'" data-m="'+m+'">'+m+'월</div>'; }
      $('bmYmpG').innerHTML=h;
    };
    bmMenu(); draw();
    requestAnimationFrame(()=>{ fitBm(); setTimeout(fitBm,260); });
    window.addEventListener('resize',()=>{ clearTimeout(window.__bmT); window.__bmT=setTimeout(fitBm,140); });
    document.addEventListener('input',(e)=>{
      if(e.target.id==='chAmt'){ const v=e.target.value.replace(/[^0-9]/g,''); e.target.value=v?(+v).toLocaleString('ko-KR'):''; } });
    document.addEventListener('click',(e)=>{
      { const pg=e.target.closest('#bmPg a[data-bp]');
        if(pg){ bmPage=+pg.dataset.bp; draw(); return; } }
      { const ec=e.target.closest('.em-c');
        if(ec){ const t=ec.dataset.em; copyTxt(t); toast(t+' 복사했어요'); return; } }
      { const f=e.target.closest('#bmFilt .si');
        if(f){ document.querySelectorAll('#bmFilt .si').forEach(x=>x.classList.toggle('on',x===f));
          bmFilt=f.dataset.f; bmPage=1; draw(); return; } }
      if(e.target.closest('#usExp')){ toast('청구 내역 CSV를 내려받았어요'); return; }
      const dd=$('bmDd');
      if(e.target.closest('#bmBtn')){ pickY=bmY; bmMenu(); dd.classList.toggle('open'); return; }
      const yn=e.target.closest('#bmYmp .hq-ymp-nav');
      if(yn){ pickY+=(+yn.dataset.yn); bmMenu(); return; }
      const mm=e.target.closest('#bmYmp .hq-ymp-m');
      if(mm){ bmY=pickY; bmM=+mm.dataset.m; bmPage=1; $('bmBtn').firstChild.textContent=bmY+'년 '+bmM+'월';
        dd.classList.remove('open'); bmMenu(); draw(); return; }
      if(!e.target.closest('#bmYmp'))dd.classList.remove('open');
      const act=e.target.closest('.bm-a[data-i]');
      if(act){ if(act.dataset.act==='inv'){ openInv(+act.dataset.i); return; }
        bmState[bmKey()+':'+act.dataset.i]=act.dataset.act; draw();
        toast({paid:'입금을 확인했어요',wait:'입금 확인을 취소했어요'}[act.dataset.act]); return; }
      if(e.target.closest('#bmAll')){
        const list=calc().filter(r=>r.amt>0);
        if(!list.length){ toast('발행할 청구서가 없어요'); return; }
        toast(list.length+'곳의 청구서를 만들고 있어요');
        const ym=bmY+String(bmM).padStart(2,'0');
        list.reduce((pr,r,n)=>pr.then(()=>saveInv(invHtml(r),'관리비서_'+bmY+'_발송비청구서'+(n?'('+(n+1)+')':''))),Promise.resolve())
          .then(()=>toast(list.length+'곳의 청구서를 저장했어요'));
        return; }
      if(e.target.closest('#ivClose')||e.target.id==='ivScrim'){ $('ivScrim').classList.remove('show'); return; }
      if(e.target.closest('#ivPdf')){
        const node=document.querySelector('#ivScrim .iv-body'); if(!node)return;
        toast('청구서를 만들고 있어요');
        saveInv(node.innerHTML,'관리비서_'+bmY+'_발송비청구서');
        return; }
    });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape')document.querySelectorAll('.hq-dd.open').forEach(x=>x.classList.remove('open')); });
  }
  renderVals(){ return {}; }
}
</script>
