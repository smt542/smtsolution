<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>  :root{--blue:#14A497;--blue-d:#0E8677;--blue-t:#E2F5F1;--blue-t2:#EFFBF8;--bg:#F2F4F6;--surface:#fff;--line:#E8EBEE;--line2:#F1F3F5;--t1:#191F28;--t2:#4E5968;--t3:#8B95A1;--t4:#B0B8C1;--green:#12B886;--green-t:#E6F8F1;--red:#F04452;--red-t:#FDECEE;--amber:#FF922B;--amber-t:#FFF3E6}
  *{box-sizing:border-box}
  body{margin:0;background:#e7eaee;font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-d)}
  .num{font-variant-numeric:tabular-nums}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
  .lc{width:100%;max-width:960px;text-align:center}
  .lc-badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-t);padding:6px 14px;border-radius:999px;margin-bottom:20px}
  .lc-logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#2CC0AC,#0E9E8C);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 26px -8px rgba(20,164,151,.5)}
  .lc-title{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0}
  .lc-sub{font-size:16px;color:var(--t3);font-weight:600;margin:8px 0 40px}
  .lc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .lc-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(23,31,40,.05);text-align:left;display:block}
  .lc-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -12px rgba(23,31,40,.22);border-color:var(--blue)}
  .lc-ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .lc-ic svg{width:26px;height:26px;stroke-width:1.9}
  .lc-ct{font-size:18px;font-weight:800;margin-bottom:5px}
  .lc-cd{font-size:13.5px;color:var(--t3);font-weight:600;line-height:1.5}
  .lc-go{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--blue)}
  .appbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;z-index:50}
  .appbar .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--t2);cursor:pointer;padding:7px 12px;border-radius:9px}
  .appbar .back:hover{background:var(--bg)}
  .appbar .ttl{font-size:14px;font-weight:700;color:var(--t3)}
  .phwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:76px 20px 30px}
  .phone{width:380px;background:#0E1420;border-radius:54px;padding:11px;box-shadow:0 30px 70px -20px rgba(23,31,40,.45)}
  .screen{background:var(--bg);border-radius:44px;overflow:hidden;position:relative;height:800px;display:flex;flex-direction:column}
  .sb{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 9px;font-size:15px;font-weight:700}
  .mscroll{flex:1;overflow:auto;display:flex;flex-direction:column}
  .mnav{height:70px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 0}
  .mnav .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer}
  .mnav .it svg{width:24px;height:24px;stroke-width:1.9}
  .mcard{background:#fff;border-radius:18px;padding:18px}
  .row-sb{display:flex;align-items:center;justify-content:space-between}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;line-height:1.4}
  .b-blue{background:var(--blue-t);color:var(--blue-d)}.b-green{background:var(--green-t);color:var(--green)}.b-red{background:var(--red-t);color:var(--red)}.b-gray{background:var(--bg);color:var(--t3)}.b-amber{background:var(--amber-t);color:var(--amber)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:700;border-radius:13px;border:1px solid transparent}
  .btn-pri{background:var(--blue);color:#fff;box-shadow:0 8px 16px -6px rgba(20,164,151,.5)}
  .btn-sec{background:#fff;color:var(--t2);border-color:var(--line)}
  .fl{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:7px}
  .in{height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:15px;font-weight:600}
  .in.ph{color:var(--t4);font-weight:500}
  .ta{min-height:100px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px;font-size:15px;color:var(--t4);font-weight:500}
  .ph-h{display:flex;align-items:center;gap:10px;padding:8px 20px 14px}
  .ph-back{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}
  .ph-back:hover{background:rgba(0,0,0,.05)}
  .ph-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .tile{background:#fff;border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(23,31,40,.18)}
  .tile-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .tile-ic svg{width:24px;height:24px;stroke-width:1.9}
  .noteBox{display:flex;gap:9px;padding:13px;background:var(--blue-t2);border-radius:12px;font-size:13px;color:var(--t2);font-weight:600;line-height:1.5}
  .pcwrap{display:contents}
  .hf-app{width:100vw;height:100vh;background:#fff;overflow:hidden;display:flex}
  .lnb-cb{display:none}
  .lnb-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);flex:none;margin-right:2px}
  .lnb-btn:hover{background:var(--bg)}
  .lnb-btn svg{width:20px;height:20px;stroke-width:2}
  .hf-app:has(#lnbToggle:checked) .hf-side{width:0;min-width:0;padding-left:0;padding-right:0;border-right:none;overflow:hidden}
  .hf-side{width:240px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;transition:width .24s cubic-bezier(.22,.61,.36,1),padding .24s cubic-bezier(.22,.61,.36,1);overflow:hidden}
  .hf-side>*{white-space:nowrap}
  .hf-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
  .hf-logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
  .hf-logo img{width:100%;height:100%;object-fit:contain}
  .hf-wm{font-size:19px;font-weight:800;letter-spacing:-.02em;color:#16375a}
  .hf-wm span{color:#17a493}
  .hf-navlbl{font-size:11px;font-weight:700;color:var(--t4);letter-spacing:.04em;padding:12px 12px 6px}
  .hf-nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .hf-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:14px;cursor:pointer;transition:.1s;color:var(--t2);font-weight:600}
  .hf-item:hover{background:var(--bg);color:var(--t2)}
  .hf-item.on{background:var(--blue);color:#fff;font-weight:700}
  .hf-item.on svg{color:#fff;stroke:#fff}
  .hf-item.on:hover{background:var(--blue-d);color:#fff}
  .hf-item svg{width:20px;height:20px;flex:none;stroke-width:1.8}
  .hf-side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--bg)}
  .hf-ava{width:34px;height:34px;border-radius:50%;background:#DCE3EA;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--t2);flex:none}
  .hf-main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
  .hf-top{height:62px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
  .hf-crumb{font-size:12px;color:var(--t3);font-weight:600}
  .hf-h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .hf-icn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .hf-body{padding:22px 24px 30px;display:flex;flex-direction:column;gap:16px;overflow:auto;flex:1;min-height:0}
  .hf-body>*{flex:none}
  .hf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hf-select{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}
  .hf-select svg{width:15px;height:15px;color:var(--t3);stroke-width:2}
  .hf-seg{display:inline-flex;background:#EDF0F3;border-radius:11px;padding:4px;gap:2px}
  .hf-seg .si{padding:7px 15px;border-radius:8px;font-size:14px;font-weight:700;color:var(--t3);cursor:pointer}
  .hf-seg .si.on{background:#fff;color:var(--t1);box-shadow:0 2px 6px rgba(23,31,40,.1)}
  .hf-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .hf-btn svg{width:16px;height:16px;stroke-width:2}
  .hf-btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 14px -4px rgba(20,164,151,.5)}
  .hf-btn.sec{background:#fff;color:var(--t2);border-color:var(--line)}
  .hf-btn.ghost{background:transparent;color:var(--t2)}
  .hf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  .hf-stat{background:#fff;border-radius:15px;padding:16px 17px;box-shadow:0 1px 3px rgba(23,31,40,.05)}
  .hf-stat .lb{font-size:13px;color:var(--t3);font-weight:600;margin-bottom:7px}
  .hf-stat .vl{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .hf-panel{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(23,31,40,.05);overflow:hidden}
  .hf-panel-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
  .hf-panel-t{font-size:15px;font-weight:800}
  .hf-tbl{width:100%;border-collapse:collapse}
  .hf-tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--t3);padding:11px 16px;border-bottom:1px solid var(--line);background:#FBFCFD;white-space:nowrap}
  .hf-tbl td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .hf-tbl tr:last-child td{border-bottom:none}
  .hf-tbl tbody tr:hover td{background:#FBFCFD;cursor:pointer}
  .hf-tbl .rt{text-align:right}
  .muted{color:var(--t3)}
  .hf-fsec{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:13px}
  .hf-fsec-h{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#FBFCFD;border-bottom:1px solid var(--line);font-size:14px;font-weight:800}
  .hf-fsec-b{padding:17px}
  .hf-in2{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:13.5px;font-weight:600;color:var(--t1)}
  .hf-in2.ph{color:var(--t4);font-weight:500}
  .hf-fgrid{display:grid;gap:13px 15px}
  .hf-fl2{font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:6px}
  .hf-seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px;font-weight:700}
  .hf-seg2 span{padding:7px 14px;color:var(--t3)}
  .hf-seg2 span.on{background:var(--blue);color:#fff}
  .hf-ck{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--t2)}
  .hf-ckb{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);flex:none;position:relative}
  .hf-ckb.on{background:var(--blue);border-color:var(--blue)}
  .hf-ckb.on::after{content:'';position:absolute;left:5.5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .hf-cc{width:18px;height:18px;border-radius:5px;border:2px solid var(--t4);display:inline-block;vertical-align:middle}
  .hf-cc.on{background:var(--blue);border-color:var(--blue)}
  .hf-tab2{display:flex;gap:4px}
  .hf-tab2 a{padding:12px 16px;font-size:14px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .hf-tab2 a.on{color:var(--blue);border-bottom-color:var(--blue)}
  .modal-scrim{position:absolute;inset:0;background:rgba(23,31,40,.45);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:20px;width:min(440px,88%);padding:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4)}
  .hf-item.soon{opacity:.45}
  .hf-hqb{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
  .hf-hqb .mk{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
  .hf-hqb .mk img{width:28px;height:28px;object-fit:contain}
  .hf-hqb .mk svg{width:19px;height:19px;stroke-width:2}
  .hf-hqb .nm{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#16375a;line-height:1.15}
  .hf-hqb .nm span{display:block;font-size:10.5px;font-weight:700;color:var(--t4);letter-spacing:.08em;margin-top:2px}
  .hq-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  .hq-k{background:#fff;border-radius:15px;padding:17px 18px;box-shadow:0 1px 3px rgba(23,31,40,.05)}
  .hq-k .lb{font-size:12.5px;color:var(--t3);font-weight:700}
  .hq-k .vl{white-space:nowrap;margin-top:9px;font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .hq-k .vl small{font-size:14px;font-weight:700;color:var(--t3);margin-left:3px;letter-spacing:0}
  .hq-k .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px;font-size:12px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
  .hq-k .sub em{font-style:normal;color:var(--blue)}
  .hq-k .sub em.r{color:var(--red)}
  .hq-2col{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .hq-2col.eq{align-items:stretch}
  .hq-pg{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 14px;border-top:1px solid var(--line2);flex:none}
  .hq-pg a{min-width:28px;height:28px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--t3);cursor:pointer}
  .hq-pg a:hover{background:var(--bg)}
  .hq-pg a.on{background:var(--blue);color:#fff}
  .hq-pg a.off{color:var(--t4);pointer-events:none}
  .hq-pg .info{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--t4);font-variant-numeric:tabular-nums}
  .hq-pb{padding:16px 18px 18px}
  .hq-bars{display:flex;align-items:flex-end;gap:14px;margin-top:6px}
  .hq-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .hq-bar .v{font-size:11.5px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
  .hq-bar .track{width:100%;height:96px;display:flex;align-items:flex-end;justify-content:center}
  .hq-bar .fill{width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:var(--line)}
  .hq-bar.on .fill{background:var(--blue)}
  .hq-bar.on .v{color:var(--blue-d)}
  .hq-bar .m{font-size:11.5px;font-weight:700;color:var(--t4)}
  .hq-bar.on .m{color:var(--t2)}

  .hq-dd{position:relative}
  .hq-dd-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:11px;font-size:13.5px;font-weight:700;color:var(--t1);cursor:pointer}
  .hq-dd-btn:hover{background:var(--bg)}
  .hq-dd-btn svg{width:14px;height:14px;stroke-width:2.2;color:var(--t3);transition:transform .18s}
  .hq-dd.open .hq-dd-btn svg{transform:rotate(180deg)}
  .hq-dd-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(23,31,40,.28);padding:6px;z-index:80}
  .hq-dd.open .hq-dd-menu{display:block}
  .hq-opt{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--t2);cursor:pointer}
  .hq-opt:hover{background:var(--bg)}
  .hq-opt.on{background:var(--blue-t);color:var(--blue-d);font-weight:700}
  .hq-opt .ck{width:15px;height:15px;flex:none;opacity:0}
  .hq-opt.on .ck{opacity:1}
  .hq-ymp{display:none;position:absolute;top:calc(100% + 6px);right:0;width:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(23,31,40,.28);padding:12px;z-index:80}
  .hq-dd.open .hq-ymp{display:block}
  .hq-ymp-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
  .hq-ymp-y{font-size:14px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .hq-ymp-nav{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}
  .hq-ymp-nav:hover{background:var(--bg)}
  .hq-ymp-nav.off{color:var(--t4);pointer-events:none}
  .hq-ymp-nav svg{width:15px;height:15px;stroke-width:2.2}
  .hq-ymp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .hq-ymp-m{height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer;font-variant-numeric:tabular-nums}
  .hq-ymp-m:hover{background:var(--bg)}
  .hq-ymp-m.on{background:var(--blue);color:#fff}
  .hq-ymp-m.off{color:var(--t4);pointer-events:none}
  .hq-ch{padding:18px 20px 6px}
  .hq-hrow{position:relative}
  .hq-tip{position:absolute;left:52px;bottom:calc(100% + 6px);z-index:60;display:none;background:#191F28;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.7;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
  .hq-hrow:hover .hq-tip{display:block}
  .hq-tip .r{display:flex;align-items:center;gap:7px}
  .hq-tip .sw{width:8px;height:8px;border-radius:2px;flex:none}
  .hq-tip .n{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.86)}
  .hq-hrow:hover .hq-stack{filter:brightness(1.04)}
  .hq-sum{display:flex;align-items:center;gap:9px;padding:14px 20px 18px;border-top:1px solid var(--line2);margin-top:14px}
  .hq-sum .lb{font-size:13px;font-weight:700;color:var(--t2)}
  .hq-sum .vl{margin-left:auto;font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const toast=(m)=>{ const el=document.getElementById('hqToast'); if(!el)return;
      el.textContent=m; el.classList.add('show');
      clearTimeout(el.__t); el.__t=setTimeout(()=>el.classList.remove('show'),1700); };
    if(document.body.__hqWired)return; document.body.__hqWired=1;

    const DATA={
      2026:[486000,452000,412000,448000,486000,512000,556000,589490,null,null,null,null],
      2025:[402000,388000,394000,416000,428000,444000,468000,472000,458000,466000,482000,498000]
    };
    const SHARE=[[.735,.159,.106],[.728,.163,.109],[.689,.165,.146],[.702,.161,.137],[.714,.158,.128],[.721,.159,.120],[.732,.160,.108],[.736,.159,.105],[.73,.16,.11],[.73,.16,.11],[.73,.16,.11],[.73,.16,.11]];
    const won=(n)=>n.toLocaleString('ko-KR');
    let year=2026;
    const drawCh=()=>{
      const arr=DATA[year], max=600000;
      const last=arr.reduce((a,v,i)=>v!=null?i:a,0);
      document.getElementById('chRows').innerHTML=arr.map((v,i)=>{
        if(v==null)return '<div class="hq-hrow"><div class="lb">'+(i+1)+'월</div><div class="hq-track"><div class="hq-stack empty" style="width:18%"></div></div><div class="tot" style="color:var(--t4);font-weight:700">—</div></div>';
        const sh=SHARE[i], w=Math.round(v/max*1000)/10;
        const A=Math.round(v*sh[0]),B=Math.round(v*sh[1]),C=v-Math.round(v*sh[0])-Math.round(v*sh[1]);
        const tip='<div class="hq-tip"><div class="r"><span class="sw" style="background:var(--blue)"></span>알림톡<span class="n">'+won(A)+'원</span></div>'
          +'<div class="r"><span class="sw" style="background:#7CC7BF"></span>문자<span class="n">'+won(B)+'원</span></div>'
          +'<div class="r"><span class="sw" style="background:#C6D3DC"></span>팩스<span class="n">'+won(C)+'원</span></div></div>';
        return '<div class="hq-hrow'+(i===last?' on':'')+'">'+tip+'<div class="lb">'+(i+1)+'월</div><div class="hq-track"><div class="hq-stack" style="width:'+w+'%">'
          +'<i class="a" style="width:'+(sh[0]*100).toFixed(1)+'%"></i><i class="b" style="width:'+(sh[1]*100).toFixed(1)+'%"></i><i class="c" style="width:'+(sh[2]*100).toFixed(1)+'%"></i>'
          +'</div></div><div class="tot">'+won(v)+'원</div></div>';
      }).join('');
      const months=arr.filter(v=>v!=null).length, tot=arr.reduce((a,v)=>a+(v||0),0);
      document.getElementById('chLg').innerHTML=
        '<div class="it"><span class="sw" style="background:var(--blue)"></span>알림톡</div>'
        +'<div class="it"><span class="sw" style="background:#7CC7BF"></span>문자</div>'
        +'<div class="it"><span class="sw" style="background:#C6D3DC"></span>팩스</div>'
        +'<div style="flex:1"></div>'
        +'<div class="it" style="color:var(--t4);font-weight:600">막대에 마우스를 올리면 채널별 금액이 보여요</div>';
      document.getElementById('chSumLb').textContent=year+'년 누계';
      document.getElementById('chSumSub').textContent=months+'개월 · 월 평균 '+won(Math.round(tot/months))+'원';
      document.getElementById('chSumVl').textContent=won(tot)+'원';
    };
    drawCh();

    const TN=[['스마일종합관리',30780,2700,3500],['대성하우징',46620,4200,5000],['한결주택관리',11160,900,1500],['세종주택관리',7020,600,1000],['청솔부동산관리',5490,450,500],['우리홈서비스',1980,150,0],['새봄주택관리',9450,750,1000],['미래에스테이트',0,0,0],['하나로주택관리',14220,1200,1500],['성원하우스',8100,600,500],['다솜주택관리',6300,450,500],['영진종합관리',12600,1050,1500]];
    let tcY=2026, tcM=8, tcPage=1, PER=6;
    const fitPer=()=>{
      const wrap=document.querySelector('#tcTbl').parentNode;
      const head=wrap.querySelector('thead');
      const row=wrap.querySelector('tbody tr');
      if(!wrap||!head||!row)return;
      const h=wrap.clientHeight-head.getBoundingClientRect().height;
      const rh=row.getBoundingClientRect().height||44;
      const n=Math.max(3,Math.floor(h/rh));
      if(n!==PER){ PER=n; drawTc(); }
    };
    const drawTc=()=>{
      const k=(tcY===2026&&tcM===8)?1:0.82+((((tcY*100+tcM)%97)%23)/100);
      const rows=TN.map(r=>{ const a=Math.round(r[1]*k/10)*10,b=Math.round(r[2]*k/10)*10,c=Math.round(r[3]*k/10)*10; return [r[0],a,b,c,a+b+c]; })
        .sort((x,y)=>y[4]-x[4]);
      const pages=Math.max(1,Math.ceil(rows.length/PER));
      if(tcPage>pages)tcPage=pages;
      const part=rows.slice((tcPage-1)*PER,tcPage*PER);
      document.getElementById('tcRows').innerHTML=part.map(r=>
        '<tr><td style="font-weight:700">'+r[0]+'</td><td class="rt num">'+won(r[1])+'</td><td class="rt num">'+won(r[2])+'</td><td class="rt num">'+won(r[3])+'</td><td class="rt num" style="font-weight:800">'+won(r[4])+'</td></tr>').join('');
      let pg='<a class="'+(tcPage===1?'off':'')+'" data-pg="'+(tcPage-1)+'">‹</a>';
      for(let i=1;i<=pages;i++)pg+='<a class="'+(i===tcPage?'on':'')+'" data-pg="'+i+'">'+i+'</a>';
      pg+='<a class="'+(tcPage===pages?'off':'')+'" data-pg="'+(tcPage+1)+'">›</a>';
      pg+='<span class="info">전체 '+rows.length+'곳</span>';
      document.getElementById('tcPg').innerHTML=pg;
    };
    const MINY=2025, MAXY=2026, MAXM=8;
    let pickY=tcY;
    const tcMenu=()=>{
      document.getElementById('tcYmpY').textContent=pickY+'년';
      document.querySelectorAll('#tcYmp .hq-ymp-nav').forEach(n=>{
        const t=pickY+(+n.dataset.yn); n.classList.toggle('off', t<MINY||t>MAXY); });
      let h='';
      for(let m=1;m<=12;m++){
        const dis=(pickY===MAXY&&m>MAXM);
        h+='<div class="hq-ymp-m'+(dis?' off':'')+((pickY===tcY&&m===tcM)?' on':'')+'" data-m="'+m+'">'+m+'월</div>';
      }
      document.getElementById('tcYmpG').innerHTML=h;
    };
    tcMenu(); drawTc();
    requestAnimationFrame(()=>{ fitPer(); setTimeout(fitPer,260); });
    window.addEventListener('resize',()=>{ clearTimeout(window.__tcT); window.__tcT=setTimeout(fitPer,140); });
    document.addEventListener('click',(e)=>{
      const dd=document.getElementById('tcDd'); if(!dd)return;
      if(e.target.closest('#tcDdBtn')){ pickY=tcY; tcMenu(); dd.classList.toggle('open'); return; }
      const yn=e.target.closest('#tcYmp .hq-ymp-nav');
      if(yn){ pickY+=(+yn.dataset.yn); tcMenu(); return; }
      const mm=e.target.closest('#tcYmp .hq-ymp-m');
      if(mm){ tcY=pickY; tcM=+mm.dataset.m; tcPage=1;
        document.getElementById('tcDdBtn').firstChild.textContent=tcY+'년 '+tcM+'월';
        dd.classList.remove('open'); tcMenu(); drawTc(); return; }
      if(e.target.closest('#tcYmp'))return;
      const pg=e.target.closest('#tcPg a[data-pg]');
      if(pg){ tcPage=+pg.dataset.pg; drawTc(); return; }
      dd.classList.remove('open');
    });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ const dd=document.getElementById('tcDd'); if(dd)dd.classList.remove('open'); } });
    document.addEventListener('click',(e)=>{
      const dd=document.getElementById('chDd'); if(!dd)return;
      if(e.target.closest('#chDdBtn')){ dd.classList.toggle('open'); return; }
      const op=e.target.closest('.hq-opt');
      if(op){ dd.querySelectorAll('.hq-opt').forEach(x=>x.classList.toggle('on',x===op));
        year=+op.dataset.y; document.getElementById('chDdBtn').firstChild.textContent=year+'년';
        dd.classList.remove('open'); drawCh(); return; }
      dd.classList.remove('open');
    });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ const dd=document.getElementById('chDd'); if(dd)dd.classList.remove('open'); } });
    document.addEventListener('click',(e)=>{
      const g=e.target.closest('[data-go]');
      if(g){ location.href='../tenant-detail/tenant-detail.dc.html?t='+g.dataset.go; }
    });
  }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
